---
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    homelab: home

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  # This host. Other hosts are added in targets/nodes.yml without touching this file.
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
        labels: { host: monitoring }
    file_sd_configs:
      - files: [/etc/prometheus/targets/nodes.yml]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: minecraft
    file_sd_configs:
      - files: [/etc/prometheus/targets/minecraft.yml]

  # Websites are probed from the outside by blackbox-exporter.
  - job_name: websites
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/targets/websites.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
