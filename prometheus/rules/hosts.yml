---
groups:
  - name: hosts
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} is unreachable"
          description: "Prometheus could not scrape {{ $labels.instance }} for 2 minutes."

      - alert: HostDiskAlmostFull
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.host }} has less than 10% free"
          description: "{{ $value | humanizePercentage }} left."

      - alert: HostDiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
          and on (instance, mountpoint) node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.host }} will be full within 24h"

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Memory on {{ $labels.host }} above 90%"
          description: "{{ $value | humanizePercentage }} used."

      - alert: HostHighCpu
        expr: 1 - avg by (instance, host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "CPU on {{ $labels.host }} above 90% for 15 minutes"

      - alert: HostOomKill
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "The kernel killed a process (out of memory) on {{ $labels.host }}"
