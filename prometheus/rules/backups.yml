---
groups:
  - name: backups
    rules:
      - alert: BackupTooOld
        expr: time() - safekeep_backup_last_success_timestamp_seconds > 36 * 3600
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "No successful backup for {{ $labels.tag }} in over 36h"
          description: "Last success {{ $value | humanizeDuration }} ago."

      - alert: BackupFailed
        expr: safekeep_backup_last_exit_code != 0
        labels: { severity: warning }
        annotations:
          summary: "Last backup of {{ $labels.tag }} failed (exit {{ $value }})"

      - alert: RestoreTestFailing
        expr: |
          safekeep_restore_test_last_exit_code != 0
          or time() - safekeep_restore_test_last_success_timestamp_seconds > 8 * 86400
        labels: { severity: critical }
        annotations:
          summary: "Restore test for {{ $labels.tag }} failed or hasn't passed in 8 days"
          description: "Backups exist, but nobody has proven they can be restored."
