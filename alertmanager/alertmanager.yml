---
route:
  receiver: discord
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers: [severity="critical"]
      receiver: discord
      repeat_interval: 2h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook
        send_resolved: true

# A dead host would otherwise also fire disk, memory and service alerts.
inhibit_rules:
  - source_matchers: [alertname="TargetDown"]
    target_matchers: [severity="warning"]
    equal: [instance]
