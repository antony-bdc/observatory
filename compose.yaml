name: monitoring

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  prometheus:
    <<: *defaults
    image: prom/prometheus:${PROMETHEUS_TAG:-v3.5.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9090:9090"

  alertmanager:
    <<: *defaults
    image: prom/alertmanager:${ALERTMANAGER_TAG:-v0.28.1}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    secrets:
      - discord_webhook
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9093:9093"

  grafana:
    <<: *defaults
    image: grafana/grafana-oss:${GRAFANA_TAG:-11.6.0}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/homelab-overview.json
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    depends_on: [prometheus]

  node-exporter:
    <<: *defaults
    image: prom/node-exporter:${NODE_EXPORTER_TAG:-v1.9.1}
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile   # backup-toolkit metrics
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile_collector:/textfile:ro

  cadvisor:
    <<: *defaults
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_TAG:-v0.49.1}
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  blackbox:
    <<: *defaults
    image: prom/blackbox-exporter:${BLACKBOX_TAG:-v0.27.0}
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox:/etc/blackbox:ro

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

secrets:
  discord_webhook:
    file: ./secrets/discord_webhook
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
